<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>background studio</title>
    <style>
        /* Global reset & base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #1a1e2b;
            transition: background-image 0.25s ease;
            padding: 16px;
        }

        /* ---------- FLOATING ADMIN ICON ---------- */
        .admin-icon {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(10, 14, 23, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            transition: all 0.25s ease;
            z-index: 100;
            user-select: none;
        }

        .admin-icon:hover {
            transform: scale(1.1);
            background: rgba(30, 35, 55, 0.9);
            border-color: rgba(255, 255, 255, 0.45);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .admin-icon.active {
            background: #4f46e5;
            border-color: #818cf8;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.35);
        }

        /* ---------- MODAL OVERLAY ---------- */
        .panel-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .panel-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .content {
            background-color: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 2rem;
            padding: 2.5rem 2rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
            color: #fff;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transform: scale(0.95);
            transition: transform 0.25s ease;
        }

        .panel-overlay.open .content {
            transform: scale(1);
        }

        h1 {
            font-weight: 600;
            font-size: 1.8rem;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .badge {
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.2);
            padding: 0.2rem 0.7rem;
            border-radius: 99px;
            font-weight: 400;
        }

        .subhead {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 1rem;
        }

        .admin-panel h2 {
            font-size: 1.3rem;
            font-weight: 500;
            margin-bottom: 1rem;
            color: #e0e7ff;
        }

        .admin-panel input[type="password"] {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.4);
            color: white;
            font-size: 1rem;
            margin-bottom: 1rem;
            outline: none;
            transition: 0.2s;
        }

        .admin-panel input[type="password"]::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .admin-panel input[type="password"]:focus {
            border-color: #a5b4fc;
            box-shadow: 0 0 0 3px rgba(165, 180, 252, 0.3);
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 0.8rem 1.6rem;
            border-radius: 60px;
            border: none;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex: 1 1 auto;
            background: #4f46e5;
            color: white;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
        }

        .btn:hover {
            background: #6366f1;
            transform: scale(1.02);
        }

        .btn.secondary {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            box-shadow: none;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn.secondary:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .btn.danger {
            background: #b91c1c;
            box-shadow: 0 4px 12px rgba(185, 28, 28, 0.4);
        }

        .btn.danger:hover {
            background: #dc2626;
        }

        /* file upload label styled as a button */
        .file-upload-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 1.6rem 1rem;
            margin-bottom: 1rem;
            border-radius: 1.2rem;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: 0.2s;
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .file-upload-label:hover {
            border-color: #818cf8;
            background: rgba(99, 102, 241, 0.15);
            color: white;
        }

        .file-upload-label.has-file {
            border-style: solid;
            border-color: #4f46e5;
            background: rgba(79, 70, 229, 0.2);
        }

        .file-upload-label input[type="file"] {
            display: none;
        }

        .file-name {
            font-size: 0.8rem;
            color: #a7f3d0;
            margin-top: -0.5rem;
            margin-bottom: 1rem;
            min-height: 1.2rem;
            word-break: break-all;
        }

        .error-msg {
            color: #fca5a5;
            font-size: 0.9rem;
            margin-top: 0.8rem;
            min-height: 1.4rem;
            font-weight: 500;
        }

        .success-msg {
            color: #a7f3d0;
            font-size: 0.9rem;
            margin-top: 0.8rem;
            min-height: 1.4rem;
        }

        .hidden {
            display: none !important;
        }

        .small-note {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.55);
            margin-top: 1.2rem;
        }

        .bg-preview {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.65);
            word-break: break-all;
            background: rgba(0,0,0,0.3);
            padding: 0.6rem 1rem;
            border-radius: 40px;
            display: inline-block;
            max-width: 100%;
        }

        @media (max-width: 480px) {
            .content {
                padding: 1.8rem 1.2rem;
                border-radius: 1.5rem;
            }
            h1 { font-size: 1.5rem; }
            .admin-icon {
                bottom: 18px;
                right: 18px;
                width: 46px;
                height: 46px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body id="mainBody" style="background-image: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?q=80&w=2070&auto=format&fit=crop');">

    <!-- floating admin icon -->
    <div class="admin-icon" id="adminIcon" title="background settings">⚙️</div>

    <!-- modal overlay -->
    <div class="panel-overlay" id="panelOverlay">
        <div class="content">
            <h1>
                ✦ background studio
                <span class="badge">admin</span>
            </h1>
            <div class="subhead">
                upload a new background
            </div>

            <!-- PASSWORD PANEL -->
            <div id="adminPanel" class="admin-panel hidden">
                <h2>🔑 enter password</h2>
                <input type="password" id="passwordInput" placeholder="password" autocomplete="off">

                <div class="button-group">
                    <button class="btn" id="loginBtn">unlock</button>
                    <button class="btn secondary" id="cancelLoginBtn">cancel</button>
                </div>
                <div id="loginMessage" class="error-msg"></div>
            </div>

            <!-- ADMIN CONTROLS (after login) -->
            <div id="adminControls" class="admin-panel hidden">
                <h2>🖼️ upload image</h2>

                <label class="file-upload-label" id="fileUploadLabel">
                    <span id="fileUploadText">📁 choose an image file</span>
                    <input type="file" id="bgFileInput" accept="image/*">
                </label>
                <div class="file-name" id="fileNameDisplay"></div>

                <div class="button-group">
                    <button class="btn" id="applyBgBtn">set as background</button>
                    <button class="btn secondary" id="clearBgBtn">clear</button>
                </div>
                <div class="button-group" style="margin-top: 8px;">
                    <button class="btn secondary" id="logoutBtn">logout</button>
                </div>

                <div id="adminMessage" class="success-msg"></div>
                <div class="bg-preview" id="currentBgPreview"></div>
                <div class="small-note">
                    💡 the image stays in your browser only (not uploaded to a server)
                </div>
            </div>

            <!-- WELCOME PANEL (when logged in but no action) -->
            <div id="welcomePanel" class="admin-panel">
                <h2>✨ ready when you are</h2>
                <p style="color: rgba(255,255,255,0.75); margin-bottom: 1.2rem; font-size: 0.95rem;">
                    click the gear icon again or close this window to return to your background.
                </p>
                <div class="button-group">
                    <button class="btn secondary" id="closeOverlayBtn">close</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ---------- CONFIG ----------
            const ADMIN_PASSWORD = "kj"; // <-- only you know this

            // ---------- DOM refs ----------
            const body = document.getElementById('mainBody');
            const adminIcon = document.getElementById('adminIcon');
            const panelOverlay = document.getElementById('panelOverlay');
            const adminPanel = document.getElementById('adminPanel');
            const adminControls = document.getElementById('adminControls');
            const welcomePanel = document.getElementById('welcomePanel');
            const passwordInput = document.getElementById('passwordInput');
            const loginBtn = document.getElementById('loginBtn');
            const cancelLoginBtn = document.getElementById('cancelLoginBtn');
            const loginMessage = document.getElementById('loginMessage');

            const bgFileInput = document.getElementById('bgFileInput');
            const fileUploadLabel = document.getElementById('fileUploadLabel');
            const fileUploadText = document.getElementById('fileUploadText');
            const fileNameDisplay = document.getElementById('fileNameDisplay');
            const applyBgBtn = document.getElementById('applyBgBtn');
            const clearBgBtn = document.getElementById('clearBgBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            const adminMessage = document.getElementById('adminMessage');
            const currentBgPreview = document.getElementById('currentBgPreview');
            const closeOverlayBtn = document.getElementById('closeOverlayBtn');

            // ---------- STATE ----------
            const DEFAULT_BG = 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?q=80&w=2070&auto=format&fit=crop';
            let currentBgUrl = DEFAULT_BG;
            let isAdminAuthenticated = false;
            let pendingImageDataUrl = null;   // holds the uploaded image (base64)
            let pendingFileName = '';

            // ---------- HELPERS ----------
            function getCurrentBackgroundUrl() {
                const bgImage = body.style.backgroundImage;
                if (bgImage && bgImage !== 'none') {
                    return bgImage.replace(/^url\(['"]?/, '').replace(/['"]?\)$/, '');
                }
                return DEFAULT_BG;
            }

            function updateBgPreview() {
                const url = getCurrentBackgroundUrl();
                if (url && url !== 'none') {
                    if (url.startsWith('data:image')) {
                        currentBgPreview.textContent = `📸 custom uploaded image`;
                    } else {
                        const displayUrl = url.length > 65 ? url.slice(0, 62) + '...' : url;
                        currentBgPreview.textContent = `📸 ${displayUrl}`;
                    }
                } else {
                    currentBgPreview.textContent = `📸 no background image`;
                }
            }

            function applyBackground(url) {
                if (!url || url.trim() === '') url = DEFAULT_BG;
                body.style.backgroundImage = `url('${url}')`;
                currentBgUrl = url;
                updateBgPreview();
            }

            // reset upload UI
            function resetUploadUI() {
                bgFileInput.value = '';
                pendingImageDataUrl = null;
                pendingFileName = '';
                fileUploadLabel.classList.remove('has-file');
                fileUploadText.textContent = '📁 choose an image file';
                fileNameDisplay.textContent = '';
                adminMessage.textContent = '';
            }

            // ---------- OVERLAY CONTROL ----------
            function openOverlay() {
                panelOverlay.classList.add('open');
                adminIcon.classList.add('active');
                if (isAdminAuthenticated) {
                    showAdminControls();
                } else {
                    showPasswordPanel();
                }
            }

            function closeOverlay() {
                panelOverlay.classList.remove('open');
                adminIcon.classList.remove('active');
                loginMessage.textContent = '';
                adminMessage.textContent = '';
                // do not clear pending upload on close; user might reopen
            }

            // ---------- PANEL SWITCHING ----------
            function showPasswordPanel() {
                adminPanel.classList.remove('hidden');
                adminControls.classList.add('hidden');
                welcomePanel.classList.add('hidden');
                passwordInput.value = '';
                loginMessage.textContent = '';
                setTimeout(() => passwordInput.focus(), 150);
            }

            function showAdminControls() {
                adminPanel.classList.add('hidden');
                adminControls.classList.remove('hidden');
                welcomePanel.classList.add('hidden');
                adminMessage.textContent = '';
                updateBgPreview();
                // don't reset upload UI automatically; keep any pending selection
            }

            function showWelcomePanel() {
                adminPanel.classList.add('hidden');
                adminControls.classList.add('hidden');
                welcomePanel.classList.remove('hidden');
            }

            // ---------- AUTH ----------
            function attemptLogin() {
                const entered = passwordInput.value;
                if (entered === ADMIN_PASSWORD) {
                    isAdminAuthenticated = true;
                    loginMessage.textContent = '';
                    resetUploadUI();
                    showAdminControls();
                } else {
                    loginMessage.textContent = '❌ wrong password';
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            }

            function logoutAdmin() {
                isAdminAuthenticated = false;
                resetUploadUI();
                showWelcomePanel();
            }

            // ---------- FILE UPLOAD HANDLING ----------
            bgFileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) {
                    resetUploadUI();
                    return;
                }

                // validate it's an image
                if (!file.type.startsWith('image/')) {
                    adminMessage.textContent = '⚠️ please select an image file';
                    adminMessage.style.color = '#fca5a5';
                    setTimeout(() => { adminMessage.textContent = ''; }, 2500);
                    resetUploadUI();
                    return;
                }

                // optional size limit (10 MB)
                if (file.size > 10 * 1024 * 1024) {
                    adminMessage.textContent = '⚠️ image must be under 10 MB';
                    adminMessage.style.color = '#fca5a5';
                    setTimeout(() => { adminMessage.textContent = ''; }, 3000);
                    resetUploadUI();
                    return;
                }

                pendingFileName = file.name;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    pendingImageDataUrl = ev.target.result;
                    // update UI to show file selected
                    fileUploadLabel.classList.add('has-file');
                    fileUploadText.textContent = '✅ image selected';
                    fileNameDisplay.textContent = `📎 ${pendingFileName}`;
                    adminMessage.textContent = '';
                };
                reader.onerror = function() {
                    adminMessage.textContent = '❌ failed to read file';
                    adminMessage.style.color = '#fca5a5';
                    resetUploadUI();
                };
                reader.readAsDataURL(file);
            });

            // set as background
            applyBgBtn.addEventListener('click', function() {
                if (!pendingImageDataUrl) {
                    adminMessage.textContent = '⚠️ please choose an image first';
                    adminMessage.style.color = '#fca5a5';
                    setTimeout(() => { adminMessage.textContent = ''; }, 2500);
                    return;
                }
                try {
                    applyBackground(pendingImageDataUrl);
                    adminMessage.textContent = '✅ background set!';
                    adminMessage.style.color = '#a7f3d0';
                    setTimeout(() => { adminMessage.textContent = ''; }, 2500);
                } catch (e) {
                    adminMessage.textContent = '❌ failed to set background';
                    adminMessage.style.color = '#fca5a5';
                }
            });

            // clear background (reset to default)
            clearBgBtn.addEventListener('click', function() {
                applyBackground(DEFAULT_BG);
                resetUploadUI();
                adminMessage.textContent = '↩️ background cleared (default restored)';
                adminMessage.style.color = '#a7f3d0';
                setTimeout(() => { adminMessage.textContent = ''; }, 2500);
            });

            // ---------- EVENT LISTENERS ----------
            adminIcon.addEventListener('click', function(e) {
                e.stopPropagation();
                if (panelOverlay.classList.contains('open')) {
                    closeOverlay();
                } else {
                    openOverlay();
                }
            });

            panelOverlay.addEventListener('click', function(e) {
                if (e.target === panelOverlay) {
                    closeOverlay();
                }
            });

            closeOverlayBtn.addEventListener('click', closeOverlay);

            loginBtn.addEventListener('click', attemptLogin);
            passwordInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') { e.preventDefault(); attemptLogin(); }
            });

            cancelLoginBtn.addEventListener('click', function() {
                showWelcomePanel();
            });

            logoutBtn.addEventListener('click', function() {
                logoutAdmin();
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && panelOverlay.classList.contains('open')) {
                    closeOverlay();
                }
            });

            // ---------- INIT ----------
            (function init() {
                const bgImage = body.style.backgroundImage;
                if (!bgImage || bgImage === 'none' || bgImage === '') {
                    body.style.backgroundImage = `url('${DEFAULT_BG}')`;
                }
                currentBgUrl = getCurrentBackgroundUrl();
                updateBgPreview();
                panelOverlay.classList.remove('open');
                adminIcon.classList.remove('active');
                showWelcomePanel();
            })();

            window.addEventListener('load', function() {
                currentBgUrl = getCurrentBackgroundUrl();
                updateBgPreview();
            });
        })();
    </script>
</body>
</html>
